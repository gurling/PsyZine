name: Android checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      extra_api:
        description: Optional newer emulator API (for example 36 or 37 once an image exists)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore optional stable development signing key
        env:
          DEVELOPMENT_KEYSTORE_BASE64: ${{ secrets.PSYZINE_DEVELOPMENT_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEVELOPMENT_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$DEVELOPMENT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/psyzine-development.jks"
          fi
      - name: Build, test, lint and verify all signed APK variants
        env:
          PSYZINE_DEVELOPMENT_KEYSTORE: ${{ runner.temp }}/psyzine-development.jks
        run: bash tools/build-apks.sh --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PpsyzineSourceUrl="https://github.com/$GITHUB_REPOSITORY"
      - name: Package corresponding source
        run: |
          git archive --format=tar.gz --prefix=PsyZine/ HEAD > "artifacts/apks/PsyZine-source-$GITHUB_SHA.tar.gz"
          cd artifacts/apks
          sha256sum "PsyZine-source-$GITHUB_SHA.tar.gz" >> SHA256SUMS
      - name: Upload installable APKs, checksums and results
        uses: actions/upload-artifact@v7
        with:
          name: PsyZine-development-APKs-${{ github.sha }}
          path: artifacts/apks/
          if-no-files-found: error
      - name: Upload build, test and lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/logs/
            build-logs/
      - name: Report failed checks
        if: failure()
        run: python3 tools/report-check-failures.py
      - name: Remove ephemeral development key
        if: always()
        run: rm -f "$RUNNER_TEMP/psyzine-development.jks"

  instrumented:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 30, 32, 33, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDirectDebugAndroidTest --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
      - name: Collect visual captures
        if: always()
        run: adb pull /sdcard/Android/data/app.psyzine.debug/files/parity-screenshots screenshots || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
      - name: Report failed device tests
        if: failure()
        run: python3 tools/report-check-failures.py

  newer-android:
    if: github.event_name == 'workflow_dispatch' && inputs.extra_api != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate newer API and enable KVM
        env:
          EXTRA_API: ${{ inputs.extra_api }}
        run: |
          [[ "$EXTRA_API" =~ ^(36|37)$ ]]
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.extra_api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDirectDebugAndroidTest --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true

      - name: Report failed newer-API tests
        if: failure()
        run: python3 tools/report-check-failures.py

  development-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, instrumented]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: PsyZine-development-APKs-${{ github.sha }}
          path: artifacts/apks
      - name: Verify downloaded APK and source checksums
        working-directory: artifacts/apks
        run: sha256sum --check SHA256SUMS
      - name: Publish verified testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-dev.${{ github.run_number }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Development-signed testing build; this is a pre-release, not a production release.

          All four APK variants, both JVM test suites, Android lint, APK signatures,
          package integrity, application IDs and checksums passed. The required
          Android emulator instrumentation matrix also passed. See BUILD_RESULTS.json
          and the linked Actions run for evidence and remaining manual acceptance checks.

          Installation: download a Direct Debug APK for isolated testing, enable
          installation from your chosen browser/file manager, then open the APK.
          Direct Release and Play Release use development signing and retain their
          release application IDs. Play APKs can be sideloaded without Google Play.
          Verify downloads with `sha256sum --check SHA256SUMS`.

          Upgrades require the same application ID and signing certificate. CI uses
          an ephemeral development key unless a stable development-key secret is
          configured; builds from separate runs may require reinstalling. Export
          test data before changing signing identities. Production keys differ.

          Corresponding GPL-3.0-or-later source and notices are included. Physical
          camera, reboot/process recovery, tablet and accessibility acceptance are
          separate checks documented in docs/verification.md.
          NOTES
          printf '\nSource commit: %s\n\nBuild evidence: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" artifacts/apks/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "PsyZine 1.0.0 development test build $GITHUB_RUN_NUMBER" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json url,isPrerelease,assets
