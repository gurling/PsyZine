name: Android checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      extra_api:
        description: Optional newer emulator API (for example 36 or 37 once an image exists)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore optional stable development signing key
        env:
          DEVELOPMENT_KEYSTORE_BASE64: ${{ secrets.PSYZINE_DEVELOPMENT_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEVELOPMENT_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$DEVELOPMENT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/psyzine-development.jks"
          fi
      - name: Build, test, lint and verify all signed APK variants
        env:
          PSYZINE_DEVELOPMENT_KEYSTORE: ${{ runner.temp }}/psyzine-development.jks
        run: bash tools/build-apks.sh -PpsyzineSourceUrl="https://github.com/$GITHUB_REPOSITORY"
      - name: Package corresponding source
        run: |
          git archive --format=tar.gz --prefix=PsyZine/ HEAD > "artifacts/apks/PsyZine-source-$GITHUB_SHA.tar.gz"
          cd artifacts/apks
          sha256sum "PsyZine-source-$GITHUB_SHA.tar.gz" >> SHA256SUMS
      - name: Upload installable APKs, checksums and results
        uses: actions/upload-artifact@v4
        with:
          name: PsyZine-development-APKs-${{ github.sha }}
          path: artifacts/apks/
          if-no-files-found: error
      - name: Upload build, test and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/logs/
            build-logs/
      - name: Remove ephemeral development key
        if: always()
        run: rm -f "$RUNNER_TEMP/psyzine-development.jks"

  instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 30, 32, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDirectDebugAndroidTest --no-daemon
      - name: Collect visual captures
        if: always()
        run: adb pull /sdcard/Android/data/app.psyzine.debug/files/parity-screenshots screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/

  newer-android:
    if: github.event_name == 'workflow_dispatch' && inputs.extra_api != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate newer API and enable KVM
        env:
          EXTRA_API: ${{ inputs.extra_api }}
        run: |
          [[ "$EXTRA_API" =~ ^(36|37)$ ]]
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.extra_api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDirectDebugAndroidTest --no-daemon
