name: Android checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_compatibility:
        description: Verify a reviewed signed candidate without publishing (requires protected environment approval)
        type: boolean
        default: false
      publish_compatibility:
        description: Publish a reviewed compatibility candidate (requires protected environment approval)
        type: boolean
        default: false
      extra_api:
        description: Optional newer emulator API (for example 36 or 37 once an image exists)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check negative signing/version policy and Obtainium selection
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build, test, lint and verify unpublished variants
        env:
          PSYZINE_SIGNING_MODE: unpublished
          PSYZINE_DEVELOPMENT_KEYSTORE: ${{ runner.temp }}/psyzine-disposable.jks
        run: bash tools/build-apks.sh --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PpsyzineSourceUrl="https://github.com/$GITHUB_REPOSITORY"
      - name: Package corresponding source
        run: |
          git archive --format=tar.gz --prefix=PsyZine/ HEAD > "artifacts/apks/PsyZine-source-$GITHUB_SHA.tar.gz"
          cd artifacts/apks
          sha256sum "PsyZine-source-$GITHUB_SHA.tar.gz" >> SHA256SUMS
      - name: Upload unpublished APKs, checksums and results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PsyZine-unpublished-APKs-${{ github.sha }}
          path: artifacts/apks/
          if-no-files-found: error
      - name: Upload build, test and lint reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/logs/
            build-logs/
      - name: Report failed checks
        if: failure()
        run: python3 tools/report-check-failures.py
      - name: Remove disposable key
        if: always()
        run: rm -f "$RUNNER_TEMP/psyzine-disposable.jks"

  large-text:
    uses: ./.github/workflows/large-text-checks.yml

  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PSYZINE_SIGNING_MODE: unpublished
      PSYZINE_DEVELOPMENT_KEYSTORE: ${{ github.workspace }}/.local/signing/ordinary-disposable.jks
      ANDROID_AVD_HOME: ${{ github.workspace }}/.local/ci-release-avds
      ANDROID_USER_HOME: ${{ github.workspace }}/.local/ci-android-user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android 17 SDK and runtime
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-37.0;google_apis_ps16k;x86_64"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0 libx11-6 libxcb1 libgl1
      - name: Enable KVM
        run: bash tools/enable-emulator-kvm.sh
      - name: Build unpublished instrumentation APKs
        run: |
          bash tools/prepare-development-signing.sh --unpublished-ci
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDirectDebug :app:assembleDirectDebugAndroidTest
      - name: Boot isolated Android 17 emulator
        run: bash tools/start-android-17-emulator.sh PsyZineOrdinary37
      - name: Run ordinary device tests
        run: bash tools/run-device-checks.sh --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: instrumented-api-37
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
            build-logs/
      - name: Stop emulator and remove disposable key
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
          rm -f "$PSYZINE_DEVELOPMENT_KEYSTORE"

  newer-android:
    if: github.event_name == 'workflow_dispatch' && inputs.extra_api != ''
    runs-on: ubuntu-24.04
    env:
      PSYZINE_SIGNING_MODE: unpublished
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate newer API and enable KVM
        env:
          EXTRA_API: ${{ inputs.extra_api }}
        run: |
          [[ "$EXTRA_API" =~ ^(36|37)$ ]]
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare disposable unpublished signing
        run: |
          export PSYZINE_DEVELOPMENT_KEYSTORE="$RUNNER_TEMP/psyzine-disposable.jks"
          echo "PSYZINE_DEVELOPMENT_KEYSTORE=$PSYZINE_DEVELOPMENT_KEYSTORE" >> "$GITHUB_ENV"
          bash tools/prepare-development-signing.sh --unpublished-ci
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ inputs.extra_api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/run-device-checks.sh --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: instrumented-api-${{ inputs.extra_api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/

      - name: Report failed newer-API tests
        if: failure()
        run: python3 tools/report-check-failures.py

  compatibility-build:
    if: github.event_name == 'workflow_dispatch' && (inputs.verify_compatibility || inputs.publish_compatibility) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    environment: compatibility
    env:
      PSYZINE_SIGNING_MODE: compatibility
      PSYZINE_COMPAT_KEYSTORE_BASE64: ${{ secrets.PSYZINE_COMPAT_KEYSTORE_BASE64 }}
      PSYZINE_COMPAT_KEY_ALIAS: ${{ secrets.PSYZINE_COMPAT_KEY_ALIAS }}
      PSYZINE_COMPAT_STORE_PASSWORD: ${{ secrets.PSYZINE_COMPAT_STORE_PASSWORD }}
      PSYZINE_COMPAT_KEY_PASSWORD: ${{ secrets.PSYZINE_COMPAT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set runner signing path
        run: echo "PSYZINE_COMPAT_KEYSTORE_FILE=$RUNNER_TEMP/psyzine-compat.jks" >> "$GITHUB_ENV"
      - name: Restore mandatory pinned compatibility identity
        run: bash tools/restore-compat-signing.sh
      - name: Build independent clean candidate
        run: |
          ./gradlew --no-daemon clean
          bash tools/build-apks.sh --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PpsyzineSourceUrl="https://github.com/$GITHUB_REPOSITORY"
          git archive --format=tar.gz --prefix=PsyZine/ HEAD > "artifacts/apks/PsyZine-source-$GITHUB_SHA.tar.gz"
          cd artifacts/apks
          sha256sum "PsyZine-source-$GITHUB_SHA.tar.gz" >> SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-build-${{ matrix.replica }}
          path: artifacts/apks/
          if-no-files-found: error
      - name: Remove runner signing container
        if: always()
        run: rm -f "$PSYZINE_COMPAT_KEYSTORE_FILE"

  compatibility-upgrade:
    if: github.event_name == 'workflow_dispatch' && (inputs.verify_compatibility || inputs.publish_compatibility) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [37]
        baseline: [code1, code2, code3]
    environment: compatibility
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.local/ci-upgrade-avds
      ANDROID_USER_HOME: ${{ github.workspace }}/.local/ci-android-user
      GH_TOKEN: ${{ github.token }}
      PSYZINE_SIGNING_MODE: compatibility
      PSYZINE_COMPAT_KEYSTORE_BASE64: ${{ secrets.PSYZINE_COMPAT_KEYSTORE_BASE64 }}
      PSYZINE_COMPAT_KEY_ALIAS: ${{ secrets.PSYZINE_COMPAT_KEY_ALIAS }}
      PSYZINE_COMPAT_STORE_PASSWORD: ${{ secrets.PSYZINE_COMPAT_STORE_PASSWORD }}
      PSYZINE_COMPAT_KEY_PASSWORD: ${{ secrets.PSYZINE_COMPAT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android 17 SDK and runtime
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-37.0;google_apis_ps16k;x86_64"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0 libx11-6 libxcb1 libgl1
      - name: Set runner signing path
        run: echo "PSYZINE_COMPAT_KEYSTORE_FILE=$RUNNER_TEMP/psyzine-compat.jks" >> "$GITHUB_ENV"
      - name: Restore mandatory pinned compatibility identity
        run: bash tools/restore-compat-signing.sh
      - name: Build reviewed baseline and consecutive candidates
        run: bash tools/build-upgrade-fixtures.sh --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable KVM
        run: bash tools/enable-emulator-kvm.sh
      - name: Boot isolated Android 17 emulator
        run: bash tools/start-android-17-emulator.sh PsyZineUpgrade37
      - name: Verify retained journal and consecutive upgrades
        run: bash tools/verify-in-place-upgrade.sh emulator-5554 artifacts/upgrade/baseline-${{ matrix.baseline }}.apk artifacts/upgrade/upgrade-test.apk artifacts/upgrade/candidate.apk artifacts/upgrade/next-candidate.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: compatibility-upgrade-api-${{ matrix.api }}-${{ matrix.baseline }}
          path: |
            artifacts/upgrade/*.log
            artifacts/upgrade/FIXTURE_APKS.json
            artifacts/upgrade/diagnostics/
          if-no-files-found: error
      - name: Stop emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true
      - name: Remove runner signing container
        if: always()
        run: rm -f "$PSYZINE_COMPAT_KEYSTORE_FILE"

  compatibility-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_compatibility && github.ref == 'refs/heads/main'
    needs: [checks, instrumented, large-text, compatibility-build, compatibility-upgrade]
    runs-on: ubuntu-24.04
    environment: compatibility
    concurrency:
      group: psyzine-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "build-tools;35.0.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-build-1
          path: artifacts/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-build-2
          path: artifacts/second-build
      - name: Check downloaded signatures, independent identities and every historical version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify-publication.py --candidate artifacts/candidate --second-build artifacts/second-build --repository "$GITHUB_REPOSITORY"
      - name: Verify Obtainium selects exactly one candidate APK
        run: python3 tools/verify-obtainium.py --assets-dir artifacts/candidate
      - name: Stage reviewed compatibility pre-release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release_policy import read_version; c,n=read_version(); print(f"{n}-compat.{c}")')"
          cp docs/compatibility-release-notes.md "$RUNNER_TEMP/compatibility-notes.md"
          printf '\nSource commit: %s\nBuild evidence: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/compatibility-notes.md"
          gh release create "v$version" artifacts/candidate/* --target "$GITHUB_SHA" --draft --prerelease --title "PsyZine Compatibility $version" --notes-file "$RUNNER_TEMP/compatibility-notes.md"
      - name: Re-download and inspect draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release_policy import read_version; c,n=read_version(); print(f"{n}-compat.{c}")')"
          gh release download "v$version" --dir artifacts/published --repo "$GITHUB_REPOSITORY"
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); import runpy; m=runpy.run_path("tools/verify-publication.py"); m["verify_candidate"](Path("artifacts/published"), "compatibility")'
          python3 tools/verify-obtainium.py --assets-dir artifacts/published
      - name: Publish only the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release_policy import read_version; c,n=read_version(); print(f"{n}-compat.{c}")')"
          gh release edit "v$version" --draft=false --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: compatibility-publication-evidence
          path: artifacts/publication/
