name: Android 17 large-text checks

on:
  push:
    branches: ['fix/custom-unit-validation']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: large-text-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android-17:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PSYZINE_SIGNING_MODE: unpublished
      PSYZINE_DEVELOPMENT_KEYSTORE: ${{ github.workspace }}/.local/signing/large-text-disposable.jks
      ANDROID_AVD_HOME: ${{ github.workspace }}/.local/ci-large-text-avds
      ANDROID_USER_HOME: ${{ github.workspace }}/.local/ci-android-user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install build SDK and Android 17 image
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-37.0;google_apis_ps16k;x86_64"
      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0 libx11-6 libxcb1 libgl1
      - name: Enable KVM
        run: bash tools/enable-emulator-kvm.sh
      - name: Build unpublished test APKs
        run: |
          bash tools/prepare-development-signing.sh --unpublished-ci
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDirectDebug :app:assembleDirectDebugAndroidTest
      - name: Boot isolated Android 17 emulator
        run: bash tools/start-android-17-emulator.sh PsyZineLargeText37
      - name: Verify platform and controlled text scaling
        run: bash tools/run-large-text-checks.sh emulator-5554
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-17-large-text-${{ github.sha }}
          path: |
            build-logs/
            screenshots/large-text/
          if-no-files-found: error
      - name: Stop emulator and remove disposable key
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
          rm -f "$PSYZINE_DEVELOPMENT_KEYSTORE"
