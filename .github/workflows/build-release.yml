name: PsyZine signed release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*', '!v*-*']

permissions:
  contents: read

concurrency:
  group: psyzine-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      PSYZINE_SIGNING_MODE: production
      PSYZINE_KEY_ALIAS: ${{ secrets.PSYZINE_KEY_ALIAS }}
      PSYZINE_STORE_PASSWORD: ${{ secrets.PSYZINE_STORE_PASSWORD }}
      PSYZINE_KEY_PASSWORD: ${{ secrets.PSYZINE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check production publication prerequisites
        env:
          CONTENT_RIGHTS_VERIFIED: ${{ vars.CONTENT_RIGHTS_VERIFIED }}
        run: |
          set -euo pipefail
          test "$CONTENT_RIGHTS_VERIFIED" = true || { echo 'Reference-content review must be recorded before signing or publication.'; exit 1; }
          version="$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release_policy import read_version; print(read_version()[1])')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
          fi
      - name: Set runner signing path
        run: echo "PSYZINE_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/psyzine-production.jks" >> "$GITHUB_ENV"
      - name: Restore mandatory existing production container
        env:
          PSYZINE_KEYSTORE_BASE64: ${{ secrets.PSYZINE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in PSYZINE_KEYSTORE_BASE64 PSYZINE_KEY_ALIAS PSYZINE_STORE_PASSWORD PSYZINE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing production input: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$PSYZINE_KEYSTORE_BASE64" | base64 --decode > "$PSYZINE_RELEASE_KEYSTORE_FILE"
      - name: Build and verify pinned production APKs
        run: bash tools/build-apks.sh --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PpsyzineSourceUrl="https://github.com/$GITHUB_REPOSITORY"
      - name: Package matching source
        run: |
          git archive --format=tar.gz --prefix=PsyZine/ HEAD > "artifacts/apks/PsyZine-source-$GITHUB_SHA.tar.gz"
          cd artifacts/apks
          sha256sum "PsyZine-source-$GITHUB_SHA.tar.gz" >> SHA256SUMS
      - name: Check historical version codes and downloaded artifact policy
        env:
          GH_TOKEN: ${{ github.token }}
        # Production tags already exist when triggered. Gate checks versions, not tag creation.
        run: |
          python3 - <<'PY'
          import os, runpy, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from release_policy import check_history
          gate = runpy.run_path('tools/verify-publication.py')
          candidate = gate['verify_candidate'](Path('artifacts/apks'), 'production')
          check_history(candidate, gate['historical_metadata'](os.environ['GITHUB_REPOSITORY'], Path('artifacts/publication')))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PsyZine-production-candidate-${{ github.sha }}
          path: artifacts/apks/
          if-no-files-found: error
      - name: Publish approved production tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release_policy import read_version; print(read_version()[1])')"
          gh release create "$GITHUB_REF_NAME" artifacts/apks/* --verify-tag --title "PsyZine $version" --notes 'GPL-3.0-or-later release with matching source and checksums. See NOTICE.md, THIRD_PARTY_NOTICES.md and PRIVACY.md. Signing identity is subject to the existing package certificate policy.'
      - name: Remove runner signing container
        if: always()
        run: rm -f "$PSYZINE_RELEASE_KEYSTORE_FILE"
